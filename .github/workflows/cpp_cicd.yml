name: Electronic_Product Deploy

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [closed]
    branches: [ "master" ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Initialize EB CLI with existing app
        run: |
          # Automatically select the first existing application (Electronic_Comp)
          printf "1\n" | eb init --region ${{ secrets.AWS_REGION }} --platform "Python 3.9" --interactive
          # Select the existing environment
          eb use cppproject

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy \
            --label "deploy-${{ github.run_id }}" \
            --timeout 20
