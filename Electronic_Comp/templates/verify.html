<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">

  <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-xl p-10 w-full max-w-md">
    <h2 class="text-4xl font-extrabold text-center text-gray-900 mb-8">
      Email Verification
    </h2>

    <p class="text-sm text-gray-600 mb-4">
      Verification code sent to: <strong>{{ email }}</strong>
    </p>

    {% if messages %}
      <div class="mb-4">
        {% for msg in messages %}
          <p class="{% if msg.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %} font-semibold">
            {{ msg }}
          </p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-gray-700">Verification Code</label>
        <input type="text" name="code" required
          class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition">
        Verify
      </button>
    </form>

    <form action="{% url 'resend_code' email=email %}" method="POST" class="mt-4">
      {% csrf_token %}
      <button type="submit"
        class="w-full bg-gray-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-gray-300 transition">
        Resend Verification Code
      </button>
    </form>

    <a href="{% url 'signin' %}" class="block text-center text-indigo-600 mt-6 hover:text-indigo-800 font-medium">
      Back to Sign-in
    </a>
  </div>

</body>
</html>
