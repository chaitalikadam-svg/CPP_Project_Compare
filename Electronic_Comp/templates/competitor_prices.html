{% block content %}

{% if prices %}
  <h3 class="text-lg font-bold mt-4">Competitor Prices</h3>
  <table class="table-auto w-full bg-gray-50 rounded shadow">
    <thead>
      <tr class="bg-indigo-100 text-gray-800 text-sm">
        <th class="px-3 py-2 text-left">Title</th>
        <th class="px-3 py-2 text-left">Price</th>
        <th class="px-3 py-2 text-left">Source</th>
        <th class="px-3 py-2 text-left">Rating</th>
      </tr>
    </thead>
    <tbody>
      {% for item in prices %}
        <tr class="text-sm hover:bg-gray-100">
          <td class="border px-3 py-2">{{ item.title }}</td>
          <td class="border px-3 py-2">{{ item.price }}</td>
          <td class="border px-3 py-2">{{ item.source }}</td>
          <td class="border px-3 py-2">{{ item.rating }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p class="text-gray-500">No competitor prices available.</p>
{% endif %}
{% endblock %}
