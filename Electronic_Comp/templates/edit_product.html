<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Product</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">

  <!-- Navbar -->
  <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="text-xl font-bold">TechieVS (Admin)</div>
    <div class="flex gap-6">
      <a href="{% url 'add_product' %}" class="hover:text-yellow-400 transition">Add Product</a>
      <a href="{% url 'product_list' %}" class="hover:text-yellow-400 transition">List Product</a>
      <a href="{% url 'logout' %}" class="hover:text-yellow-400 transition">Logout</a>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="flex items-center justify-center py-10">
    <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-xl p-10 w-full max-w-2xl">
      <!-- Heading -->
      <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-8">
        Edit Product
      </h2>

      <!-- Success/Error Messages -->
      {% if messages %}
        <div class="mb-6">
          {% for msg in messages %}
            <p class="text-center font-semibold 
              {% if msg.tags == 'success' %} text-green-600 {% else %} text-red-600 {% endif %}">
              {{ msg }}
            </p>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Form -->
      <form action="{% url 'edit_product' item.category item.productid %}" method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Category (read-only) -->
        <div>
          <label for="category" class="block text-sm font-semibold text-gray-700">Category</label>
          <input id="category" type="text" name="category" value="{{ item.category }}" readonly
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-100 shadow-sm focus:outline-none"/>
        </div>

        <!-- Product ID (read-only) -->
        <div>
          <label for="productid" class="block text-sm font-semibold text-gray-700">Product ID</label>
          <input id="productid" type="text" name="productid" value="{{ item.productid }}" readonly
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-100 shadow-sm focus:outline-none"/>
        </div>

        <!-- Name -->
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700">Name</label>
          <input id="name" type="text" name="name" value="{{ item.name }}" required
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Brand -->
        <div>
          <label for="brand" class="block text-sm font-semibold text-gray-700">Brand</label>
          <input id="brand" type="text" name="brand" value="{{ item.brand }}" required
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Model -->
        <div>
          <label for="model" class="block text-sm font-semibold text-gray-700">Model</label>
          <input id="model" type="text" name="model" value="{{ item.model }}" required
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Price -->
        <div>
          <label for="price" class="block text-sm font-semibold text-gray-700">Price</label>
          <input id="price" type="number" step="0.01" name="price" value="{{ item.price }}" required
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Warranty -->
        <div>
          <label for="warranty" class="block text-sm font-semibold text-gray-700">Warranty</label>
          <input id="warranty" type="text" name="warranty" value="{{ item.warranty }}" required
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Weight -->
        <div>
          <label for="weightkg" class="block text-sm font-semibold text-gray-700">Weight (kg)</label>
          <input id="weightkg" type="number" step="0.001" name="weightkg" value="{{ item.weightkg }}" required
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Spec Score -->
        <div>
          <label for="specscore" class="block text-sm font-semibold text-gray-700">Spec Score (out of 100)</label>
          <input id="specscore" type="number" name="specscore" value="{{ item.specscoreoutof100 }}" required min="1" max="100"
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Features JSON -->
        <div>
          <label for="features_json" class="block text-sm font-semibold text-gray-700">Features (Upload JSON)</label>
          <input id="features_json" type="file" name="features_json" accept=".json"
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
        </div>

        <!-- Image -->
        <div>
          <label for="image" class="block text-sm font-semibold text-gray-700">Replace Image (optional)</label>
          <input id="image" type="file" name="image" accept="image/*"
            class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
          {% if image_url %}
            <p class="mt-2 text-sm text-gray-600">Current Image:</p>
            <img src="{{ image_url }}" alt="{{ item.name }}" class="mt-2 rounded-lg shadow-md"/>
          {% endif %}
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit"
            class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
