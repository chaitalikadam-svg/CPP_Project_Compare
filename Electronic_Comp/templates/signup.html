<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">

  <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-xl p-10 w-full max-w-md">
    <h2 class="text-4xl font-extrabold text-center text-gray-900 mb-8">
      Sign Up
    </h2>

    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <p class="{% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %} font-semibold">
            {{ message }}
          </p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-gray-700">Username</label>
        <input type="text" name="username" required
          class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Email</label>
        <input type="email" name="email" required
          class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Password</label>
        <input type="password" name="password" required
          class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Confirm Password</label>
        <input type="password" name="confirm_password" required
          class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"/>
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-green-300 transition">
        Sign Up
      </button>
    </form>
    <p class="mt-8 text-center text-sm text-gray-700">
      Already have an account?
      <a href="{% url 'signin' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Sign In</a>
    </p>
  </div>

</body>
</html>
